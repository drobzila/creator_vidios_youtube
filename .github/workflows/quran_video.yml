name: Quran Video Generator (scheduled)

on:
  schedule:
    - cron: '0 6 * * *'  # يوميا 06:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install telethon google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Prepare Telegram session (from secret or file)
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}  # optional secret
        run: |
          # If TELEGRAM_SESSION_B64 secret exists, decode it to session.session
          if [ -n "${TELEGRAM_SESSION_B64}" ]; then
            echo "Decoding TELEGRAM_SESSION_B64 secret..."
            echo "${TELEGRAM_SESSION_B64}" | base64 --decode > session.session
            chmod 600 session.session || true
          fi

          # If session.b64 is committed in repo (not recommended publicly), decode it if session.session missing
          if [ ! -f session.session ] && [ -f session.b64 ]; then
            echo "Decoding session.b64 file in repo..."
            base64 --decode session.b64 > session.session || true
            chmod 600 session.session || true
          fi

          ls -l session.session || echo "No session.session created (will try interactive login)"

      - name: Run quran video maker
        run: python quran_video_maker.py

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-generator-logs
          path: output_logs/

name: Video Blend CI

on:
  push:
    paths:
      - 'input_videos/**'
      - 'background_videos/**'
  workflow_dispatch: {}

jobs:
  blend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install apt packages (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Create output folder
        run: mkdir -p outputs

      - name: Run video blender
        env:
          INPUT1: input_videos
          INPUT2: background_videos
          OUTPUT: outputs
          BG_PER_EFFECT: 3
          COMPRESS: "true"
          CRF: 28
        run: |
          python3 video_blend_headless.py \
            --input1_dir "${INPUT1}" \
            --input2_dir "${INPUT2}" \
            --output_dir "${OUTPUT}" \
            --bg_per_effect "${BG_PER_EFFECT}" \
            --compress "${COMPRESS}" \
            --crf "${CRF}"

      - name: Upload outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blended-videos
          path: outputs/

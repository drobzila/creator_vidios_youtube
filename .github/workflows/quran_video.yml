name: Quran Video Generator 🎥

on:
  schedule:
    - cron: '0 6 * * *'  # ⏰ كل يوم الساعة 6:00 صباحًا بتوقيت UTC (7:00 صباحًا بتوقيت الجزائر)
  workflow_dispatch:      # ⚡ تشغيل يدوي من زر "Run workflow"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------
    # 🔹 الخطوة 1: تحميل المستودع
    # -----------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------
    # 🔹 الخطوة 2: إعداد Python
    # -----------------------------
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # -----------------------------
    # 🔹 الخطوة 3: تثبيت المتطلبات
    # -----------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install telethon google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 tqdm

    # -----------------------------
    # 🔹 الخطوة 4: فكّ الجلسة المشفّرة
    # -----------------------------
    - name: Decode Telegram session (if provided)
      run: |
        if [ -n "${{ secrets.TELEGRAM_SESSION_B64 }}" ]; then
          echo "📦 Decoding TELEGRAM_SESSION_B64 secret..."
          echo "${{ secrets.TELEGRAM_SESSION_B64 }}" | base64 --decode > session.session
          chmod 600 session.session
          ls -l session.session
        else
          echo "⚠️ No TELEGRAM_SESSION_B64 secret found — using existing session if present."
        fi

    # -----------------------------
    # 🔹 الخطوة 5: تشغيل السكربت
    # -----------------------------
    - name: Run Quran Video Maker
      run: |
        echo "🚀 Starting Quran Video Generator..."
        python quran_video_maker.py

    # -----------------------------
    # 🔹 الخطوة 6: حفظ السجلات
    # -----------------------------
    - name: Upload logs artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quran-generator-logs
        path: output_logs/
        if-no-files-found: ignore
        compression-level: 6

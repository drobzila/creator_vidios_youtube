name: Video Blend CI (Drive sync + blending)

on:
  workflow_dispatch:
  push:
    paths:
      - 'video_blend_headless.py'
      - 'input_videos/**'
      - 'background_videos/**'

jobs:
  blend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
          pip install --upgrade pip
          pip install -U gdown moviepy

      - name: Prepare directories
        run: mkdir -p input_videos background_videos outputs

      - name: Smart sync from Google Drive
        env:
          DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1JYb3bI1PFJIHCPm8Vwm26b6vX7w5gL_C?usp=sharing
        run: |
          echo "🔍 Checking missing files in Google Drive..."
          python3 - <<'PYCODE'
import os, re, subprocess, json, sys

drive_url = os.environ.get("DRIVE_FOLDER_URL", "").strip()
if not drive_url:
    sys.exit("❌ DRIVE_FOLDER_URL مفقود")

folder = "background_videos"
os.makedirs(folder, exist_ok=True)

m = re.search(r'/folders/([a-zA-Z0-9_-]+)', drive_url)
if not m:
    sys.exit("❌ رابط Google Drive غير صالح")

print("📁 Fetching file list from Drive...")
proc = subprocess.run(["gdown", "--folder", drive_url, "--dry-run", "--json"],
                      capture_output=True, text=True)

if proc.returncode != 0:
    print(proc.stderr)
    sys.exit("⚠️ فشل في تنفيذ gdown --dry-run")

try:
    files = json.loads(proc.stdout)
except Exception as e:
    print("⚠️ لم يتمكن من قراءة القائمة:", e)
    files = []

if not files:
    sys.exit("❌ لم يتم العثور على ملفات في المجلد!")

local = set(os.listdir(folder))
missing = [f for f in files if f["name"] not in local]

if not missing:
    print("✅ لا توجد ملفات ناقصة.")
else:
    print(f"⬇️ سيتم تحميل {len(missing)} ملف جديد...")
    for f in missing:
        name = f["name"].replace(" ", "_")
        file_id = f["id"]
        try:
            print(f"  → تحميل {name} ...")
            subprocess.run(
                ["gdown", f"https://drive.google.com/uc?id={file_id}", "-O", os.path.join(folder, name)],
                check=True
            )
        except subprocess.CalledProcessError:
            print(f"⚠️ فشل تحميل {name}، سيتم تخطيه.")
print("✅ المزامنة مع Google Drive تمت بنجاح.")
PYCODE

      - name: Run video blending
        run: |
          python3 video_blend_headless.py \
            --input1_dir input_videos \
            --input2_dir background_videos \
            --output_dir outputs \
            --bg_per_effect 3 \
            --compress true \
            --crf 28

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: blended-videos
          path: outputs/

name: Write Salam to videos.txt

on:
  push:
  schedule:
    - cron: '0 7 * * *'  # كل يوم الساعة 7 صباحًا UTC
  workflow_dispatch:      # يمكن تشغيله يدويًا أيضًا

permissions:
  contents: write   # 👈 ضروري حتى يُسمح له بالدفع (push)

jobs:
  write-salam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write "السلام عليكم" to videos.txt
        run: |
          echo "السلام عليكم ورحمة الله وبركاته 🌸 - $(date '+%Y-%m-%d %H:%M:%S')" >> videos.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.txt
          git commit -m "🤍 أُضيف سطر سلام جديد إلى videos.txt" || echo "No changes to commit"
          git push

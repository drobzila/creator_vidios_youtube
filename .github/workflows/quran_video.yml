name: Quran Video Generator (scheduled)

on:
  schedule:
    - cron: '0 6 * * *'  # كل يوم 06:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install telethon google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Prepare Telegram session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          if [ -n "${TELEGRAM_SESSION_B64}" ]; then
            echo "${TELEGRAM_SESSION_B64}" | base64 --decode > session.session
            chmod 600 session.session
          fi
          if [ ! -f session.session ] && [ -f session.b64 ]; then
            base64 --decode session.b64 > session.session
            chmod 600 session.session
          fi

      - name: Run Quran Video Maker
        run: python quran_video_maker.py

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-generator-logs
          path: output_logs/
          if-no-files-found: ignore

name: Quran Video Generator 🎥

on:
  schedule:
    - cron: "0 6 * * *"   # كل يوم الساعة 6:00 UTC = 7:00 بتوقيت الجزائر
  workflow_dispatch:       # تشغيل يدوي من GitHub عند الحاجة

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Quran Short Videos
    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      # 🔄 استرجاع قاعدة البيانات processed.db من آخر تشغيل
      - name: 🔄 Restore processed.db
        uses: actions/download-artifact@v4
        with:
          name: processed-db
          path: .
        continue-on-error: true  # يتجاهل الخطأ لو لم تكن موجودة أول مرة

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 tqdm

      - name: 🎞️ Install FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: 🔐 Decode Telegram session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          echo "$TELEGRAM_SESSION_B64" | base64 --decode > session.session
          echo "✅ Telegram session restored."

      - name: 🚀 Run Quran Video Maker
        run: |
          echo "🚀 Starting Quran Video Generator..."
          python quran_video_maker.py

      # 💾 حفظ قاعدة البيانات بعد انتهاء السكربت
      - name: 📦 Save processed database
        uses: actions/upload-artifact@v4
        with:
          name: processed-db
          path: processed.db
